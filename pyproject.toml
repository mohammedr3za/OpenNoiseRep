[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noiserep"
version = "0.0.1"
description = "Read raw heart-rate / activity data off the Noise REP band, no vendor app."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
noiserep = "noiserep.cli:main"

[tool.setuptools.packages.find]
include = ["noiserep*"]
