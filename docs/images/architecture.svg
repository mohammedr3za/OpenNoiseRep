<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">noiserep architecture</title>
  <desc id="desc">Flow from the Noise REP band over BLE through chunked transport and protocol decoders into a SQLite store, then analytics and the GUI, menu bar, CLI and export.</desc>

  <rect width="1200" height="430" fill="#FAFAF7"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#91918D"/>
    </marker>
    <style>
      .box { fill: #FFFFFF; stroke: #E8E4DF; stroke-width: 1.5; }
      .title { font: 700 17px "Helvetica Neue", Arial, sans-serif; fill: #191919; }
      .sub { font: 12px "Helvetica Neue", Arial, sans-serif; fill: #666663; }
      .label { font: 600 11px "Helvetica Neue", Arial, sans-serif; fill: #666663; letter-spacing: .6px; }
      .flow { stroke: #91918D; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <!-- row 1 -->
  <rect class="box" x="30" y="60" width="180" height="92" rx="14"/>
  <text class="label" x="48" y="86">DEVICE</text>
  <text class="title" x="48" y="112">Noise REP</text>
  <text class="sub" x="48" y="132">BLE · no bond · no auth</text>

  <rect class="box" x="250" y="60" width="200" height="92" rx="14"/>
  <text class="label" x="268" y="86">TRANSPORT</text>
  <text class="title" x="268" y="112">Chunks + acks</text>
  <text class="sub" x="268" y="132">start / end / NACK</text>

  <rect class="box" x="490" y="60" width="230" height="92" rx="14"/>
  <text class="label" x="508" y="86">PROTOCOL</text>
  <text class="title" x="508" y="112">Commands + decoders</text>
  <text class="sub" x="508" y="132">32 · 112 · 113/115 · 4097</text>

  <rect class="box" x="760" y="60" width="180" height="92" rx="14"/>
  <text class="label" x="778" y="86">ORCHESTRATION</text>
  <text class="title" x="778" y="112">sync.py</text>
  <text class="sub" x="778" y="132">partial results, timeouts</text>

  <rect class="box" x="980" y="60" width="190" height="92" rx="14"/>
  <text class="label" x="998" y="86">STORE</text>
  <text class="title" x="998" y="112">SQLite</text>
  <text class="sub" x="998" y="132">samples · sleep · RRI · files</text>

  <path class="flow" d="M210 106 H250"/>
  <path class="flow" d="M450 106 H490"/>
  <path class="flow" d="M720 106 H760"/>
  <path class="flow" d="M940 106 H980"/>

  <!-- analytics -->
  <rect x="980" y="200" width="190" height="92" rx="14" fill="#EBDBCF" stroke="#E2CDBD" stroke-width="1.5"/>
  <text class="label" x="998" y="226">ANALYTICS</text>
  <text class="title" x="998" y="252">analytics.py</text>
  <text class="sub" x="998" y="272">HR · HRV · coverage · rest</text>
  <path class="flow" d="M1075 152 V200"/>

  <!-- outputs -->
  <rect class="box" x="760" y="200" width="180" height="92" rx="14"/>
  <text class="label" x="778" y="226">DESKTOP</text>
  <text class="title" x="778" y="252">PySide6 GUI</text>
  <text class="sub" x="778" y="272">overview · sleep · charts</text>

  <rect class="box" x="540" y="200" width="180" height="92" rx="14"/>
  <text class="label" x="558" y="226">MENU BAR</text>
  <text class="title" x="558" y="252">♥ 72 · ♥ ~</text>
  <text class="sub" x="558" y="272">live HR · away-lock</text>

  <rect class="box" x="320" y="200" width="180" height="92" rx="14"/>
  <text class="label" x="338" y="226">HEADLESS</text>
  <text class="title" x="338" y="252">CLI</text>
  <text class="sub" x="338" y="272">sync · sleep · workouts</text>

  <rect class="box" x="100" y="200" width="180" height="92" rx="14"/>
  <text class="label" x="118" y="226">EXPORT</text>
  <text class="title" x="118" y="252">CSV / JSON</text>
  <text class="sub" x="118" y="272">your data, portable</text>

  <path class="flow" d="M980 246 H940"/>
  <path class="flow" d="M760 246 H720"/>
  <path class="flow" d="M540 246 H500"/>
  <path class="flow" d="M320 246 H280"/>

  <!-- footer note -->
  <rect x="30" y="340" width="1140" height="58" rx="12" fill="#F0F0EB" stroke="#E8E4DF"/>
  <text class="sub" x="50" y="365">Read-only by default: 32 · 112 · 113 · 115 · 117 · 123 + transport acks. No auth, no bond, no cloud.</text>
  <text class="sub" x="50" y="385">One explicit exception: the opt-in, <tspan font-weight="700">--yes</tspan>-gated <tspan font-weight="700">buzz</tspan> haptics command. Sleep stages and workouts appear only if the band sends them.</text>
</svg>
