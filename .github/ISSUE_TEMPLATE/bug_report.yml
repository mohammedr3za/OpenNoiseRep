name: Bug report
description: Report a crash, a wrong decode, or a failed sync
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Privacy first:** never paste your band's MAC address, serial number,
        or real health values. Captures, databases, exports and `-v` logs all
        contain them. Redact before attaching anything.

        Security issues belong in the private process described in
        `SECURITY.md`, not in a public issue.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `noiserep ...`
        2. ...
        3. ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - decode (offline capture)
        - sync (live BLE)
        - export (CSV/JSON)
        - GUI
        - install / packaging
        - docs
        - other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: noiserep version
      description: From `pip show noiserep` or the release archive name.
      placeholder: "0.0.1"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows (unsupported)
        - Other
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.4"

  - type: input
    id: firmware
    attributes:
      label: Band model / firmware
      description: Model and firmware are fine. Do not include the serial or MAC.
      placeholder: "R1..., firmware 1.4.0"

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste `-v` output after replacing the MAC, serial and health values with placeholders.
      render: shell

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy checklist
      options:
        - label: I removed the band MAC, serial number and real health values.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true
