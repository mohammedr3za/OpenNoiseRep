name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os
          import sys

          sys.path.insert(0, ".")
          import noiserep

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if tag != noiserep.__version__:
              sys.exit(
                  f"tag {tag!r} does not match noiserep.__version__ "
                  f"{noiserep.__version__!r}"
              )
          PY

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libfreetype6 libx11-xcb1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[ble,gui]' pyinstaller

      - name: Build GUI app
        run: python tools/build_app.py --onedir

      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: |
          arch="$(uname -m)"
          tar -C dist -czf "noiserep-${GITHUB_REF_NAME}-linux-${arch}.tar.gz" noiserep

      - name: Archive (macOS)
        if: runner.os == 'macOS'
        run: |
          arch="$(uname -m)"
          if [ -d dist/noiserep.app ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              dist/noiserep.app "noiserep-${GITHUB_REF_NAME}-macos-${arch}.zip"
          else
            ditto -c -k --sequesterRsrc --keepParent \
              dist/noiserep "noiserep-${GITHUB_REF_NAME}-macos-${arch}.zip"
          fi

      - name: Note unsigned macOS build
        if: runner.os == 'macOS'
        run: |
          echo "::warning::The macOS app is unsigned and not notarized. Users must right-click > Open (or clear the quarantine attribute) on first launch."

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: noiserep-${{ runner.os }}-${{ runner.arch }}
          path: |
            noiserep-*.tar.gz
            noiserep-*.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release if needed, then attach assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --generate-notes \
              --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
