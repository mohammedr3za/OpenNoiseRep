name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install core test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run tests
        # Capture-dependent decoder tests skip when no .pklg is present, which
        # is the normal CI case. -ra in pyproject keeps the skip reasons visible.
        run: python -m pytest -q

  gui:
    name: GUI smoke (offscreen)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libfreetype6 libx11-xcb1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Install core + live dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,ble]'

      - name: Install GUI extras (optional)
        id: gui-deps
        # If no wheel exists for this Python, the GUI smoke test skips through
        # pytest.importorskip instead of failing the whole job.
        continue-on-error: true
        run: python -m pip install -e '.[gui]'

      - name: Note skipped GUI dependency install
        if: steps.gui-deps.outcome != 'success'
        run: echo "::warning::GUI extras unavailable; GUI tests will skip."

      - name: Run tests
        run: python -m pytest -q
